<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ingresar | Panel de Administración</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body class="pagina-acceso">

    <header class="header">

        <div class="contenedor nav">

            <a href="../index.html" class="logo">
                <span>🎓</span>
                <div>
                    <strong>EDUCANDO CONCIENCIA</strong>
                    <small>Panel de Administración</small>
                </div>
            </a>

            <a href="../index.html" class="volver">
                ← Volver al inicio
            </a>

        </div>

    </header>


    <main class="acceso-main">

        <div class="contenedor" style="max-width: 500px; margin: 0 auto;">

            <section class="login-card" style="margin: 0 auto;">

                <div class="login-icono">🔐</div>

                <div class="formulario-titulo">
                    <span>ACCESO RESTRINGIDO</span>
                    <h1>Panel de administración</h1>
                    <p>Ingresá con tu cuenta de administrador de Educando Conciencia.</p>
                </div>

                <form id="adminLoginForm">

                    <div class="campo">
                        <label for="adminEmail">Correo electrónico</label>
                        <input
                            type="email"
                            id="adminEmail"
                            name="adminEmail"
                            placeholder="admin@educandoconciencia.com.ar"
                            autocomplete="username"
                            required
                        >
                    </div>

                    <div class="campo">
                        <label for="adminPassword">Contraseña</label>
                        <input
                            type="password"
                            id="adminPassword"
                            name="adminPassword"
                            placeholder="Ingresá tu contraseña"
                            autocomplete="current-password"
                            required
                        >
                    </div>

                    <button type="submit" class="btn btn-principal btn-form">
                        🔐 Ingresar
                    </button>

                    <div id="mensajeAdminLogin" class="mensaje-form" aria-live="polite"></div>

                </form>

                <div class="login-inicio">
                    <a href="../index.html">← Volver al inicio</a>
                </div>

            </section>

        </div>

    </main>


    <footer class="footer">
        <div class="contenedor">
            <p>© 2026 Educando Conciencia</p>
            <p>Plan Canje Educativo</p>
        </div>
    </footer>

    <script src="../js/config.js"></script>
    <script src="../js/app.js"></script>

</body>
</html>
