services:
  - type: web
    name: plan-canje-educando
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@educandoconciencia.com.ar
      - key: ADMIN_INITIAL_PASSWORD
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: plan-canje-educando-db
          property: connectionString

databases:
  - name: plan-canje-educando-db
    plan: free
    databaseName: plan_canje_educando
    user: plan_canje
